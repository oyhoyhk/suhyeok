# Builds 수혁 desktop (desktop/: Tauri app that runs suhyeok-server on this computer and opens other computers' 수혁)
# for Windows (NSIS installer) and Linux (AppImage, deb), and attaches them to the release that triggered it.
# Run by hand (workflow_dispatch) to get the bundles as artifacts only. server-rs tests run in their own job.
name: desktop

on:
  release:
    types: [published]
  workflow_dispatch:
  # The cross-platform work is checked on its branch before it reaches main (workflow_dispatch needs the file on main).
  push:
    branches: [cross-platform]

permissions:
  contents: write

jobs:
  test-server:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: server-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
      - run: cargo test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            name: suhyeok-desktop-windows
            files: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundles: appimage,deb
            name: suhyeok-desktop-linux
            files: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev \
            libxdo-dev libssl-dev libdbus-1-dev build-essential curl wget file patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server-rs
            desktop/src-tauri
      - name: Server sidecar and art
        # suhyeok-server (release) → desktop/src-tauri/binaries/suhyeok-server-<target triple>[.exe],
        # art/out + art/roster.json → desktop/src-tauri/art/
        run: bash desktop/prepare.sh
      - name: Build bundles
        working-directory: desktop
        # The app's version follows the Mac app's VERSION file.
        run: npx -y @tauri-apps/cli@2.12.4 build --bundles ${{ matrix.bundles }} --config "{\"version\":\"$(cat ../VERSION)\"}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(desktop/src-tauri/target/release/bundle/nsis/*.exe desktop/src-tauri/target/release/bundle/appimage/*.AppImage desktop/src-tauri/target/release/bundle/deb/*.deb)
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
