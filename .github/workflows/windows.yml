# Builds 수혁 for Windows (windows/: a Tauri window onto the Mac's /desk page) and attaches the installer
# to the release that triggered it. Run by hand (workflow_dispatch) to get the installer as an artifact only.
name: windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - name: Build installer
        # The app's version follows the Mac app's VERSION file.
        run: npx -y @tauri-apps/cli@2.12.4 build --config "{\"version\":\"$(cat ../VERSION)\"}"
      - uses: actions/upload-artifact@v4
        with:
          name: suhyeok-windows
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" src-tauri/target/release/bundle/nsis/*.exe
