[package]
name = "suhyeok-server"
version = "0.1.0"
edition = "2021"
description = "수혁 server for Windows and Linux: reads Claude Code / Codex sessions and serves the shared /desk page and API (contract/README.md)"
publish = false

[lib]
name = "suhyeok"
path = "src/lib.rs"

[[bin]]
name = "suhyeok-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
rand = "0.9"
hex = "0.4"
dirs = "6"
sysinfo = "0.37"
regex = "1"
portable-pty = "0.9.0"
vt100 = "0.18.1"

[dev-dependencies]
tempfile = "3"
